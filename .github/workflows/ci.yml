# CI/CD pipeline (REQUIREMENTS INF-014..INF-022, E-001..E-016, SEC-001..SEC-012;
# DECISIONS D-051..D-054, D-050).
#
# Triggers: pull requests and pushes to main (D-051). Every quality gate that
# the local workflow enforces runs here too; any failure fails the pipeline.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests with coverage
        run: pytest -q --cov=app --cov-fail-under=80

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history (SEC-001, REJ-001..REJ-003)

      # Pinned gitleaks binary, not gitleaks-action: the action wrapper
      # exited 1 on this repo despite reporting "no leaks found"
      # (run 33381634652). Direct CLI is deterministic.
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --redact --exit-code 1

  docker:
    name: Docker build, scan & GHCR push
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    permissions:
      contents: read
      packages: write # push images to GHCR (D-054)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; github.repository can contain
      # uppercase (e.g. Owner/Nyaya).
      - name: Compute image names
        id: images
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-frontend" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true # local image for the Trivy scan below
          tags: nyaya-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: nyaya-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nyaya-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nyaya-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Publish only from main, tagged with the commit SHA (D-054).
      - name: Push backend image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha

      - name: Push frontend image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha

  # Deployment (E-016, Full-Stack track; DECISIONS D-054): on push to main,
  # once images are published to GHCR, roll them out on the production server
  # over SSH. Requires repository secrets: DEPLOY_HOST, DEPLOY_USER,
  # DEPLOY_SSH_KEY (private key), GHCR_PULL_TOKEN (PAT with read:packages).
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GHCR_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Roll out on server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          BACKEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-backend:${GITHUB_SHA}"
          FRONTEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-frontend:${GITHUB_SHA}"

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            GHCR_PULL_TOKEN="$GHCR_PULL_TOKEN" \
            GHCR_OWNER="$GHCR_OWNER" \
            GITHUB_REPO="$GITHUB_REPOSITORY" \
            BACKEND_IMAGE="$BACKEND_IMAGE" \
            FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            'set -e
             cd ~/nyaya-ai
             git fetch https://x-access-token:${GHCR_PULL_TOKEN}@github.com/${GITHUB_REPO}.git main
             git reset --hard FETCH_HEAD
             git config remote.origin.url "https://github.com/${GITHUB_REPO}.git"
             echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin >/dev/null
             BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose pull api worker frontend
             BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose up -d --remove-orphans api worker frontend'

      - name: Verify rollout
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'for i in $(seq 1 30); do
               if [ "$(curl -sf http://localhost:8000/api/v1/health | grep -c "\"status\":\"ok\"")" = 1 ]; then
                 echo "API healthy"; exit 0
               fi
               sleep 10
             done
             echo "API failed health check after rollout"; exit 1'

      - name: Record deployment
        run: |
          echo "## Nyaya release ${{ github.sha }} deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend image: \`ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-backend:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend image: \`ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-frontend:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rolled out on \`${DEPLOY_USER}@${DEPLOY_HOST}\` and health-verified." >> "$GITHUB_STEP_SUMMARY"
