# CI/CD pipeline (REQUIREMENTS INF-014..INF-022, E-001..E-016, SEC-001..SEC-012;
# DECISIONS D-051..D-054, D-050).
#
# Triggers: pull requests and pushes to main (D-051). Every quality gate that
# the local workflow enforces runs here too; any failure fails the pipeline.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests with coverage
        run: pytest -q --cov=app --cov-fail-under=80

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history (SEC-001, REJ-001..REJ-003)

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build, scan & GHCR push
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    permissions:
      contents: read
      packages: write # push images to GHCR (D-054)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; github.repository can contain
      # uppercase (e.g. Owner/Nyaya).
      - name: Compute image names
        id: images
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-frontend" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true # local image for the Trivy scan below
          tags: nyaya-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: nyaya-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nyaya-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nyaya-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Publish only from main, tagged with the commit SHA (D-054).
      - name: Push backend image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha

      - name: Push frontend image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha

  # Deployment interface (E-016, Full-Stack track): publish of the
  # deployment summary is automatic on main once the images are pushed; the
  # actual server rollout is gated behind the `production` GitHub
  # environment, which a repository administrator must create with the
  # DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets. Until then this job
  # stays queued (never fails, never pretends to have deployed).
  deploy:
    name: Deploy (gated)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Record deployable release
        run: |
          echo "## Nyaya release ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend image: \`ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-backend:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend image: \`ghcr.io/${GITHUB_REPOSITORY,,}/nyaya-frontend:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollout: run \`docker compose pull api worker frontend && docker compose up -d\` on the server (see README 'Deployment')." >> "$GITHUB_STEP_SUMMARY"
