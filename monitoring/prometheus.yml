# Prometheus scrape config for the Nyaya stack (Phase 8 observability).
# The API exposes Prometheus text format at /api/v1/metrics.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nyaya
    metrics_path: /api/v1/metrics
    # /api/v1/metrics requires the METRICS_TOKEN bearer when configured
    # (see .env.example). The same token lives in this gitignored file,
    # mounted read-only by the prometheus compose service.
    bearer_token_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
