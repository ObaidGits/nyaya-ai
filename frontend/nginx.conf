# Static SPA served by nginx; /api reverse-proxied to the backend container
# so the browser only ever talks to one origin (ARCHITECTURE deployment view).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise server internals.
    server_tokens off;

    # Resolve `api` per-request via Docker's embedded DNS so api container
    # restarts (new IP) never leave nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming responses (SSE chat) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
